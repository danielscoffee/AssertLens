name: Jev advisory review

# Regular PR event: fork secrets stay unavailable. Execute only base-branch tooling.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: jev-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base tooling and policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR objects without checking them out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: "AUTHORIZATION: bearer ${{ github.token }}"
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$PR_HEAD_SHA" ]; then
            echo 'PR changed during fetch. Review unavailable; rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install and preflight Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-user --unshare-pid --disable-userns -- /bin/true
      - name: Run trusted Bubblewrap integration smoke
        run: node --test --test-name-pattern='real Bubblewrap' test/sandbox.test.ts
      - name: Sandbox tests and review immutable PR source
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node src/assertlens.ts --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA" -- npm test >> "$GITHUB_STEP_SUMMARY"
